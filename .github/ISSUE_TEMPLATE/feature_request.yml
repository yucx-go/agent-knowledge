name: Feature request
description: Suggest an idea, adapter, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is unnecessarily hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the project do? Be as concrete as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search / retrieval
        - Knowledge compilation / dream cycle
        - Adapters (new agent integration)
        - MCP server / tools
        - CLI
        - Storage / vault
        - Docs / examples
        - Other
