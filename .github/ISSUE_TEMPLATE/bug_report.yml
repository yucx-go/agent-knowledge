name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps / commands. CLI invocation, MCP tool call, or Python snippet.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-knowledge version
      description: "Output of `ak --version` or `pip show agent-knowledge`."
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client (if MCP)
      options:
        - Not MCP / CLI only
        - Claude Code
        - Cursor
        - Codex
        - Other MCP client
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
